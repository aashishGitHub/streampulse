# ============================================================================
#  StreamPulse local stack
#
#  PROFILES: nothing starts unless you ask for its profile. This matters —
#  running the whole estate costs roughly 8-10 GB of RAM. Start what the phase
#  you are working on needs:
#
#    make up-core   Kafka, moto, Postgres, Redis, Keycloak  (Phase 2+)
#    make up-aws    moto, DynamoDB Local                   (Phase 4+)
#    make up-obs    Prometheus, Grafana, Tempo, Loki       (Phase 8+)
#    make up-full   everything
#
#  Phase 0 needs NONE of this. It is declared now so the shape of the system is
#  visible from the start, and so each later phase only has to flip a profile on.
#
#  IMAGE TAGS ARE PINNED. `latest` makes a build non-reproducible and one day
#  breaks CI for reasons unrelated to your change.
#
#  VERIFY before first use: image tags below were chosen at authoring time and
#  should be checked against current releases.
# ============================================================================

name: streampulse

services:
  # -------------------------------------------------------------------------
  # MOTO — fakes Kinesis, S3 and SQS. THE default event backbone.
  #
  # In `core` rather than `aws`, because Kinesis is no longer optional: it is what
  # ingest publishes to by default. Free, no AWS account, no credentials.
  # -------------------------------------------------------------------------
  moto:
    image: motoserver/moto:5.2.2       # `latest` was a 5.2.3.dev build; 5.2.2 verified with `docker manifest inspect`
    profiles: [core]
    container_name: sp-moto
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/moto-api/')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # KAFKA — the PRIMARY event backbone (ADR-0012, which supersedes ADR-0008).
  # KRaft mode: no ZooKeeper, single broker for local dev.
  #
  # In `core` as well as `kafka`: ingest publishes here by default, and the stream
  # processor needs it. Kinesis on moto stays available as a comparison adapter
  # (streampulse.backbone=kinesis).
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    profiles: [core, kafka]
    container_name: sp-kafka
    ports:
      - "9092:9092"      # clients on the host connect here
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # KRaft: one node does both
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker ⇒ every replication factor must be 1, or topic creation fails.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0     # rebalance immediately in dev
      # A topic that does not exist must FAIL, not be created on first use with 1
      # partition and default retention. A silently auto-created telemetry.raw.v1 has
      # one partition, which makes every ordering and scaling claim in this repo untrue.
      # kafka-init below creates the real ones.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # KAFKA-INIT — creates the topics, then exits. One-shot by design: topic
  # definitions (partitions, retention) are infrastructure and live here, not in
  # a service's @Bean NewTopic, because KafkaAdmin blocks service startup for its
  # full operation timeout whenever the broker is down.
  #
  # Partition counts follow api/asyncapi/streampulse-topics.yaml: raw is wide
  # because it carries every event; agg is narrow because windowing already
  # reduced the volume.
  # -------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.1
    profiles: [core, kafka]
    container_name: sp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:19092
        $$T --bootstrap-server $$B --create --if-not-exists --topic telemetry.raw.v1 --partitions 12 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic telemetry.agg.v1 --partitions 6 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic telemetry.raw.v1.dlt --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic telemetry.agg.v1.dlt --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --list

  # -------------------------------------------------------------------------
  # POSTGRES — control plane. wal_level=logical is required for Debezium CDC
  # (Phase 6): without it the replication slot cannot be created.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    container_name: sp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: streampulse
      POSTGRES_PASSWORD: streampulse      # local only; real secrets never live in git
      POSTGRES_DB: streampulse
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"               # ← enables CDC in Phase 6
      - "-c"
      - "max_replication_slots=4"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streampulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # REDIS — hot metric cache, idempotency keys, distributed rate-limit buckets.
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    profiles: [core]
    container_name: sp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # KEYCLOAK — real OIDC provider issuing real JWTs. Chosen over a mock so the
  # JWT validation path is genuinely exercised (and it is the Java-ecosystem
  # standard, so it is a transferable skill). ADR-0011.
  #
  # The realm is IMPORTED rather than clicked together in the admin console, so
  # a fresh machine gets a working IdP from `make up-core` with no manual step —
  # and so KeycloakOidcIT can boot the SAME realm file from the test classpath.
  # An IdP whose configuration lives only in someone's browser history is an IdP
  # nobody else can reproduce.
  #
  # Same tag as the one KeycloakOidcIT pins. If these drift, the test starts
  # proving something about a Keycloak nobody runs.
  # -------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [core]
    container_name: sp-keycloak
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Keycloak imports every *.json in this directory on boot. Read-only: a
      # container that can rewrite its own source of truth makes "what realm is
      # actually running?" unanswerable.
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    command: ["start-dev", "--import-realm"]
    healthcheck:
      # NOT /health — Keycloak 26 serves the management endpoints on port 9000,
      # not 8080. The realm's own discovery document is a better probe anyway:
      # it returns 200 only once the IMPORT has finished, which is the thing a
      # dependent service actually needs.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/streampulse/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # -------------------------------------------------------------------------
  # DYNAMODB LOCAL — AWS's own emulator, so fidelity is high.
  # -------------------------------------------------------------------------
  dynamodb:
    image: amazon/dynamodb-local:2.5.3
    profiles: [aws]
    container_name: sp-dynamodb
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  # -------------------------------------------------------------------------
  # OBSERVABILITY (Phase 8)
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [obs]
    container_name: sp-prometheus
    ports:
      # Host 9091, not 9090: ingest-gateway's gRPC server listens on 9090 (GRPC_PORT),
      # so the default Prometheus port collides the moment both run on one machine.
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Services run on the host, not in compose. Docker Desktop defines this name already; on
    # Linux it needs this entry.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [obs]
    container_name: sp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      # Mounting /etc/grafana/provisioning replaces the image's (empty) default tree, so every
      # provisioning file must live under observability/grafana/provisioning.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -------------------------------------------------------------------------
  # UI helpers
  # -------------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    profiles: [ui]
    container_name: sp-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

volumes:
  postgres-data:
