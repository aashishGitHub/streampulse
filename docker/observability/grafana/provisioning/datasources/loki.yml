apiVersion: 1

datasources:
  - name: Loki
    uid: streampulse-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # logs -> trace. trace_id is structured metadata, so the field is matched by label name
      # rather than by a regex over the line. `$$` is how provisioning writes a literal `$`;
      # a single `$` would be expanded as an environment variable and come out empty.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
          datasourceUid: streampulse-tempo
