global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Recording rules (the SLIs) and alerts. Mounted by compose.obs.yml; the glob matching nothing,
# as in a stack started without that file, is not an error.
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape jobs for the telemetry stack itself (collector, Tempo, Loki). A separate file so that
# a stack without them has no permanently-down targets.
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

# The services run on the host (./gradlew bootRun), not in compose, so the container
# reaches them through host.docker.internal. On Linux that name needs the
# extra_hosts entry in COMPOSE-SNIPPET.md.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: ingest-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: query-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: stream-processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: sink-writer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8084']
