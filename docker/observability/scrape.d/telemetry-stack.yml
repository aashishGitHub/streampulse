# Self-metrics of the telemetry pipeline. If the collector drops spans, no dashboard of the
# services will say so: it has to be watched on its own.
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
