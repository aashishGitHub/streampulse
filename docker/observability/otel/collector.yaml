# OpenTelemetry Collector: the one address every service sends telemetry to.
#
# WHY a collector and not agent -> Tempo/Loki directly: services keep one endpoint and one
# protocol, while where the data ends up (and any batching, sampling or redaction) changes here
# without redeploying a JVM. Metrics are deliberately NOT piped through here: Micrometer already
# exposes them to Prometheus (ADR-0024), so there is no metrics pipeline.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # First in every pipeline: refuses data before the collector itself is out of memory.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki ingests OTLP natively at /otlp; this exporter appends /v1/logs itself.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
