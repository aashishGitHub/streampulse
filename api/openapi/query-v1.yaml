openapi: 3.1.0
info:
  title: StreamPulse Query API
  version: 1.0.0
  description: |
    Serves dashboards: historical metric queries and a live SSE stream.

    Reads are split by access pattern. The latest value per series comes from Redis; history
    comes from Postgres (`metric_window`). The API hides which, but reports `source` so a slow
    response can be explained rather than guessed at.

    Authentication is declared below but NOT enforced yet: no token is validated and `tenantId`
    is taken from the caller. This is a known gap, not a design.
servers:
  - url: http://localhost:8082
security:
  - bearerAuth: []
paths:
  /v1/metrics/{tenantId}/{metric}:
    get:
      operationId: queryMetric
      summary: Query a metric over a time range
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - name: metric
          in: path
          required: true
          schema: { type: string, enum: [CONCURRENT_VIEWERS, REBUFFER_RATIO, ERROR_RATE, STARTUP_TIME_MS, AVG_BITRATE_KBPS] }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: titleId, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
      responses:
        '200':
          description: Matching windows, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  windows:
                    type: array
                    items:
                      type: object
                      properties:
                        windowStart: { type: string, format: date-time }
                        value: { type: number }
                        sampleCount: { type: integer, description: Low counts mean low confidence; the UI dims them }
                        isFinal: { type: boolean, description: False while the window may still receive late events }
                        titleId: { type: string, description: Empty when the aggregate has no title }
                        region: { type: string }
                  source:
                    type: string
                    enum: [cache, store, mixed]
                    description: Which tier answered. Exposed for debugging latency, not for clients to branch on.
        '400':
          description: Missing or unparseable parameter, or `from` not before `to`
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '404':
          description: A metric the system does not produce
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '503':
          description: Blocking capacity is exhausted; retry shortly
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  /v1/titles/{titleId}/overview:
    get:
      operationId: getTitleOverview
      summary: Latest metrics, recent history and metadata for one title, in one call
      description: |
        Three independent lookups run concurrently under ONE overall time budget (a 300 ms
        target, measured from the arrival of the request). A lookup that fails or misses the
        budget is replaced by an empty value and named in `degraded`; the response is still 200.
        When every lookup fails the response is still 200 with all three names in `degraded`.
        Clients must treat an empty part together with its name in `degraded` as "unknown", not "none".
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string } }
        - { name: tenantId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The overview, possibly degraded
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, titleId, latest, history, degraded]
                properties:
                  tenantId: { type: string }
                  titleId: { type: string }
                  metadata:
                    description: Null when `metadata` is listed in `degraded`
                    oneOf:
                      - type: 'null'
                      - type: object
                        properties:
                          titleId: { type: string }
                          name: { type: string }
                  latest:
                    type: array
                    description: Newest window per series (region and metric) for this title
                    items:
                      type: object
                      properties:
                        titleId: { type: string }
                        region: { type: string }
                        metric: { type: string }
                        windowStart: { type: string, format: date-time }
                        windowEnd: { type: string, format: date-time }
                        value: { type: number }
                        sampleCount: { type: integer }
                        computedAt: { type: string, format: date-time }
                  history:
                    type: array
                    description: Recent windows for this title, oldest first
                    items:
                      type: object
                      properties:
                        titleId: { type: string }
                        region: { type: string }
                        metric: { type: string }
                        windowStart: { type: string, format: date-time }
                        value: { type: number }
                        sampleCount: { type: integer }
                  degraded:
                    type: array
                    description: Parts that are empty because they FAILED or timed out, not because there is no data
                    items: { type: string, enum: [latest, history, metadata] }
        '400':
          description: Missing or blank `tenantId`
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  /v1/stream/metrics:
    get:
      operationId: streamMetrics
      summary: Live metric stream (Server-Sent Events)
      description: |
        `text/event-stream`. Chosen over WebSocket because the flow is one-directional, it
        works over ordinary HTTP through any proxy, and the browser reconnects on its own.

        Operational details that matter:
          - A comment heartbeat every 15s keeps proxies from closing an idle connection.
          - `Last-Event-ID` on reconnect resumes from a bounded Redis ring buffer, so a
            brief drop does not leave a gap in the chart.
          - A slow client gets the LATEST value, not a queued backlog. For a live
            dashboard, stale-but-current beats complete-but-behind.
      parameters:
        - { name: tenantId, in: query, required: true, schema: { type: string } }
        - { name: metrics, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
          description: Sent automatically by the browser on reconnect. Resumes from this point.
      responses:
        '200':
          description: An open event stream
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: Missing `tenantId`, or a `Last-Event-ID` that is not a stream entry id
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ProblemDetail:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
