# ============================================================================
#  ingest-gateway configuration
#
#  Every value here is a decision. Where a default would be wrong or surprising,
#  the comment says why.
# ============================================================================

spring:
  application:
    name: ingest-gateway

  threads:
    virtual:
      # Java 21 virtual threads for request handling. This workload blocks on Kafka
      # and Redis, so a blocked virtual thread unmounts instead of holding an OS
      # thread — concurrency is bounded by memory, not by a pool size someone guessed.
      # ADR-0006 records why this rather than WebFlux.
      enabled: true

  lifecycle:
    # Upper bound on each SmartLifecycle shutdown phase (BS-01 / REQ-LC-02).
    # Kubernetes terminationGracePeriodSeconds must exceed the TOTAL across phases.
    timeout-per-shutdown-phase: 25s

  # -------------------------------------------------------------------------
  # OAuth2 resource server (REQ-IG-07/08/09, ADR-0011).
  #
  # `issuer-uri` is doing four jobs at once, which is why it is one line and not
  # four. Spring Boot turns it into NimbusJwtDecoder.withIssuerLocation(...), so:
  #
  #   1. the OIDC discovery document is fetched from <issuer>/.well-known/…
  #   2. the JWKS url is read from it, and the RS256 PUBLIC key is fetched from
  #      the issuer — this service holds no key material at all
  #   3. an unknown `kid` triggers a re-fetch, so a key rotation needs no restart
  #   4. a JwtIssuerValidator is installed, so a token minted by some OTHER
  #      provider is refused even if its signature were somehow acceptable
  #
  # `audiences` adds the check that issuer alone cannot make. One realm has one
  # signing key, so every client of this Keycloak produces signatures we trust.
  # `aud` is what says the token was minted FOR ingest — without it, a leaked
  # analytics-dashboard token is a valid write credential for telemetry.
  #
  # Both are asserted end to end, against a real Keycloak, by KeycloakOidcIT.
  #
  # The default points at `make up-core`'s Keycloak (compose maps it to 8081).
  # In a real deployment both come from the environment.
  # -------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/streampulse}
          audiences:
            - ${OIDC_AUDIENCE:streampulse-ingest}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms          # a slow Redis must not become a slow ingest; we fail open
      lettuce:
        pool:
          max-active: 16
          max-wait: 200ms

  # Kafka is the default backbone (ADR-0012). `streampulse.backbone: kinesis` switches to
  # the Kinesis-on-moto comparison adapter.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        # --- delivery guarantees: these three are correctness, not tuning ---
        enable.idempotence: true      # PID + sequence numbers: a producer retry cannot
                                      # duplicate or reorder a record
        acks: all                     # every in-sync replica must have it before we ack
        max.in.flight.requests.per.connection: 5
                                      # must stay at or below the idempotence limit, or the
                                      # broker cannot deduplicate within its window.
                                      # VERIFY the exact limit in current Kafka docs.

        # --- throughput: latency traded for batching. Phase 9 tunes these with numbers ---
        linger.ms: 20                 # wait up to 20ms to fill a batch
        batch.size: 65536             # 64 KB
        compression.type: lz4         # fast; zstd compresses harder but costs more CPU

        # --- timeouts ---
        delivery.timeout.ms: 120000   # TOTAL budget send→ack, INCLUDING retries
        request.timeout.ms: 30000     # one attempt; must be <= delivery.timeout.ms

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful                  # let in-flight requests finish before the JVM exits

# ---------------------------------------------------------------------------
# Actuator. Liveness and readiness are DIFFERENT questions and must not share a
# probe:
#   readiness = "can I serve traffic right now?"  → includes dependencies
#   liveness  = "am I broken beyond recovery?"    → must NOT include dependencies
#
# Pointing liveness at a dependency check is a classic outage amplifier: Redis
# blips, every pod fails liveness, Kubernetes restarts them all, and now you have
# a cold cache on top of the original problem.
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true                 # registers the two groups below and the
                                      # livenessState/readinessState indicators
      show-details: always            # local only; production would be when-authorized
      group:
        # Spring Boot would derive both groups from `probes.enabled` alone. They
        # are written out because the MEMBERSHIP is the decision, and a decision
        # that only exists as a framework default is one nobody reviews.
        #
        # HealthProbesIT asserts the shape below, including the part that is an
        # omission rather than an entry.
        liveness:
          # livenessState ONLY. Never a dependency.
          #
          # Liveness answers "am I broken beyond recovery?", and the only cure
          # Kubernetes has for a failed liveness probe is a restart. Put Redis in
          # here and a Redis blip restarts every pod simultaneously — a cold JVM
          # and a cold cache on top of the original incident. Ingest explicitly
          # fails OPEN when Redis is unreachable (ADR-0007), so a Redis outage is
          # not even a reason to stop serving, let alone to restart.
          include: livenessState
        readiness:
          # readinessState ONLY, for now.
          #
          # This is the group IngestDrainLifecycle flips: publishing
          # REFUSING_TRAFFIC turns it OUT_OF_SERVICE, the endpoint returns 503,
          # and Kubernetes removes the pod from the Service before anything stops
          # working (BS-01 / REQ-LC-01).
          #
          # A dependency belongs here only if a request genuinely cannot be
          # served without it — Kinesis would qualify, Redis does not. Phase 9
          # revisits it with measurements rather than opinions.
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Without a histogram only mean and max exist, and a p99 panel has nothing to compute from.
      percentiles-histogram:
        http.server.requests: true

# ---------------------------------------------------------------------------
# Our own settings. Typed and validated in IngestProperties, so a missing or
# out-of-range value fails at STARTUP — the pod never passes readiness — rather
# than on the first request that happens to touch it.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# AWS. Locally every client is pointed at moto — a fake AWS API in a container.
# Credentials are the literal string "test": NOTHING reaches AWS and no account
# is needed. In a real deployment endpoint-override is absent and the SDK
# resolves credentials normally (env, profile, instance role).
#
# What this does NOT prove: moto implements the API surface, not the service.
# No IAM enforcement, no throttling, meaningless latency. See ADR-0003.
# ---------------------------------------------------------------------------
streampulse:
  backbone: ${STREAMPULSE_BACKBONE:kafka}   # kafka | kinesis

  aws:
    endpoint-override: ${AWS_ENDPOINT_OVERRIDE:http://localhost:5001}
    region: ${AWS_REGION:us-east-1}
    kinesis-stream-name: ${KINESIS_STREAM:telemetry-raw-v1}

  ingest:
    raw-topic: telemetry.raw.v1
    max-batch-size: 500               # matches api/openapi/ingest-v1.yaml
    max-in-flight-batches: 64         # the backpressure bound (REQ-IG-19)
    permit-wait: 250ms                # how long to wait for a permit before 503
    idempotency-ttl: 24h              # dedup keys expire, or the set grows forever
    fail-open-on-idempotency-error: true
    # Per-tenant admission control (REQ-IG-20). Capacity is the burst a tenant may send;
    # refill is the sustained rate. A fixed window would allow a double burst across the
    # boundary; a token bucket caps the spike and the long-run rate separately.
    quota-capacity: 10000
    quota-refill-per-second: 2000
    # Bounded drain on SIGTERM. Must be well under Kubernetes terminationGracePeriodSeconds
    # (Phase 11 sets 45s), or the pod is killed mid-drain and the ordering buys nothing.
    drain-timeout: 20s

    # gRPC ingest (BS-09). A SECOND protocol over the same use case, not a second service.
    grpc:
      # Its own port: a different protocol on a different connection, and in Kubernetes a
      # different Service too, because long-lived HTTP/2 connections need L7 load balancing
      # while REST is happy with L4. REQ-GR-07 and ADR-0010.
      # 0 = let the OS choose, which is what the integration tests pass so that two test
      # classes in one build cannot collide on a fixed port.
      port: ${GRPC_PORT:9090}
      # Events gathered per call into the use case — the ACK interval AND the inbound
      # flow-control window, deliberately the same number so they cannot disagree.
      # Explainable, not measured; Phase 9 replaces it.
      stream-flush-size: 50
      # Bounded, like the HTTP drain. drain-timeout (20s) + this + the HTTP graceful shutdown
      # must all fit inside terminationGracePeriodSeconds, or the pod is SIGKILLed mid-drain.
      shutdown-timeout: 10s
                                      # Redis down ⇒ publish anyway and count it.
                                      # At-least-once with duplicates beats losing
                                      # telemetry. Deliberate trade; see ADR-0007.

    # Circuit breaker + timeout around the publisher (REQ-IG-21 / REQ-RS-02, REQ-RS-06).
    # Starting points chosen to be explainable, not measured — Phase 9 replaces them.
    publisher-resilience:
      sliding-window-size: 20            # decide on the last 20 calls
      minimum-number-of-calls: 10        # ...but never on fewer than 10, so two unlucky
                                         # calls at 04:00 cannot open the breaker
      failure-rate-threshold: 50         # percent failed that opens it
      slow-call-rate-threshold: 50       # percent SLOW that opens it, even if all succeed
      slow-call-duration-threshold: 2s   # above this a SUCCESS still counts as slow
      wait-duration-in-open-state: 30s   # refuse everything this long, then probe
      permitted-calls-in-half-open-state: 5
      call-timeout: 5s                   # hard ceiling; must exceed slow-call threshold,
                                         # or every slow call becomes a timeout and the
                                         # slow-call signal never fires
      # Retry rides over a single FAST blip (REQ-RS-01). Deliberately small: every attempt
      # holds the in-flight permit, so retries multiply capacity use during an incident.
      # Worst case here is ~0.3s of extra hold, against 5s if timeouts were retried too.
      retry-max-attempts: 3              # 1 call + 2 retries
      retry-initial-backoff: 100ms
      retry-backoff-multiplier: 2.0      # 100ms, 200ms
      retry-jitter-factor: 0.5           # ±50%, so retries do not arrive in lockstep

logging:
  level:
    com.streampulse: DEBUG
